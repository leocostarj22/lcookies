PLG_TASK_LCOOKIES="Task - LCookies"
PLG_TASK_LCOOKIES_XML_DESCRIPTION="Scheduled tasks of LCookies for System → Scheduled Tasks: deletes the consent records older than the retention period set in the options of the component, and scans the site for cookies."
PLG_TASK_LCOOKIES_PURGE_TITLE="LCookies - Delete Expired Consent Records"
PLG_TASK_LCOOKIES_PURGE_DESC="Deletes the consent records older than the retention period (Components → LCookies → Options → Consent Log). Expired records are also deleted now and then while visitors save their choices; a daily task keeps the log on time on any site."
PLG_TASK_LCOOKIES_LOG_PURGED="%1$d expired consent records deleted (retention: %2$d months)."
PLG_TASK_LCOOKIES_LOG_DISABLED="The LCookies component is disabled: nothing was deleted."
PLG_TASK_LCOOKIES_SCAN_TITLE="LCookies - Scan the Site for Cookies"
PLG_TASK_LCOOKIES_SCAN_DESC="Checks the server responses of the pages of the site (Components → LCookies → Cookie Scanner) for cookies set before consent and cookies that are not declared, and sends an e-mail when it finds any. Cookies set by scripts are only found by a scan started from the backend."
PLG_TASK_LCOOKIES_SCAN_EMAILS_LABEL="E-mail Addresses"
PLG_TASK_LCOOKIES_SCAN_EMAILS_DESC="Addresses that receive the e-mail when the scan finds problems, separated by commas. Leave empty to send it to the Super Users who receive system e-mails."
PLG_TASK_LCOOKIES_LOG_SCANNED="%1$d pages scanned: %2$d problems before consent, %3$d cookies not declared."
PLG_TASK_LCOOKIES_LOG_MAIL_FAILED="The e-mail to %1$s could not be sent: %2$s"
PLG_TASK_LCOOKIES_MAIL_SCAN_TITLE="LCookies: Cookie Scan"
PLG_TASK_LCOOKIES_MAIL_SCAN_DESC="Sent by the scheduled task \"LCookies - Scan the Site for Cookies\" when it finds cookies set before consent or cookies that are not declared."
PLG_TASK_LCOOKIES_MAIL_SCAN_SUBJECT="{SITENAME}: the cookie scan found problems"
PLG_TASK_LCOOKIES_MAIL_SCAN_BODY="The scheduled cookie scan of {SITENAME} ({URL}) checked {PAGES} pages and found:\n\n- {ISSUES} cookies or requests before the visitor's consent;\n- {UNKNOWN} cookies that are not declared in LCookies.\n\nSee the results and fix them: {LINK}\n\nThis e-mail is sent by the plugin \"Task - LCookies\" of your own site."
