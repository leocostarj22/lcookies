PLG_TASK_LCOOKIES="Tarefa - LCookies"
PLG_TASK_LCOOKIES_XML_DESCRIPTION="Tarefas agendadas do LCookies para Sistema → Tarefas agendadas: elimina os registos de consentimento mais antigos do que o período de retenção definido nas opções do componente e analisa os cookies do site."
PLG_TASK_LCOOKIES_PURGE_TITLE="LCookies - Eliminar registos de consentimento expirados"
PLG_TASK_LCOOKIES_PURGE_DESC="Elimina os registos de consentimento mais antigos do que o período de retenção (Componentes → LCookies → Opções → Registo de consentimentos). Os registos expirados também são eliminados de vez em quando, à medida que os visitantes gravam as escolhas; uma tarefa diária mantém o registo em dia em qualquer site."
PLG_TASK_LCOOKIES_LOG_PURGED="%1$d registos de consentimento expirados eliminados (retenção: %2$d meses)."
PLG_TASK_LCOOKIES_LOG_DISABLED="O componente LCookies está desativado: nada foi eliminado."
PLG_TASK_LCOOKIES_SCAN_TITLE="LCookies - Analisar os cookies do site"
PLG_TASK_LCOOKIES_SCAN_DESC="Verifica as respostas do servidor nas páginas do site (Componentes → LCookies → Scanner de cookies), à procura de cookies criados antes do consentimento e de cookies não declarados, e envia um e-mail quando encontra algum. Os cookies criados por scripts só são encontrados por um scan iniciado no backend."
PLG_TASK_LCOOKIES_SCAN_EMAILS_LABEL="Endereços de e-mail"
PLG_TASK_LCOOKIES_SCAN_EMAILS_DESC="Endereços que recebem o e-mail quando o scan encontra problemas, separados por vírgulas. Deixe vazio para o enviar aos Super Utilizadores que recebem e-mails do sistema."
PLG_TASK_LCOOKIES_LOG_SCANNED="%1$d páginas analisadas: %2$d problemas antes do consentimento, %3$d cookies não declarados."
PLG_TASK_LCOOKIES_LOG_MAIL_FAILED="Não foi possível enviar o e-mail para %1$s: %2$s"
PLG_TASK_LCOOKIES_MAIL_SCAN_TITLE="LCookies: scan de cookies"
PLG_TASK_LCOOKIES_MAIL_SCAN_DESC="Enviado pela tarefa agendada \"LCookies - Analisar os cookies do site\" quando encontra cookies criados antes do consentimento ou cookies não declarados."
PLG_TASK_LCOOKIES_MAIL_SCAN_SUBJECT="{SITENAME}: o scan de cookies encontrou problemas"
PLG_TASK_LCOOKIES_MAIL_SCAN_BODY="O scan agendado de cookies de {SITENAME} ({URL}) verificou {PAGES} páginas e encontrou:\n\n- {ISSUES} cookies ou pedidos antes do consentimento do visitante;\n- {UNKNOWN} cookies não declarados no LCookies.\n\nVeja os resultados e corrija-os: {LINK}\n\nEste e-mail é enviado pelo plugin \"Tarefa - LCookies\" do seu próprio site."
