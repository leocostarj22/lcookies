PLG_PRIVACY_LCOOKIES="Privacy - LCookies"
PLG_PRIVACY_LCOOKIES_XML_DESCRIPTION="Includes the LCookies consent records of a user in the export requests of Users → Privacy and removes them with the remove requests. Only choices made while logged in are linked to an account."
PLG_PRIVACY_LCOOKIES_REMOVAL_LABEL="On Remove Requests"
PLG_PRIVACY_LCOOKIES_REMOVAL_DESC="Unlinking keeps the consent records as proof of consent but removes the link to the user account (what is left is a random consent ID and hashes). Deleting removes the records."
PLG_PRIVACY_LCOOKIES_REMOVAL_UNLINK="Unlink from the account"
PLG_PRIVACY_LCOOKIES_REMOVAL_DELETE="Delete the records"
